# World 7: encoder → distance. The goal number is what the robot actually drove
# (drivenCm, worked out by the referee), ± 2 cm.
id: "07-02"
world: 7
kind: core
title: Fita métrica
objective: Anda até ficares a menos de 10 cm da parede e mostra no ecrã quantos centímetros andaste. Usa o encoder - uma volta da roda são 20,4 cm.
concepts: [encoder, variáveis]
assumes: [ultrassom, esperar até, matemática]
toolbox: expert
timeLimit: 40

variants:
  params:
    wallX: { min: 80, max: 180, step: 5 }
  seeds: [1, 2, 3, 4, 5, 6]

map:
  items:
    - wall: { x: wallX, y: 1, w: 4, h: 120.5 }

spawn: { x: 30, y: 61.25, heading: 0 }

goals:
  - displayShows: { number: drivenCm, tolerance: 2, label: Mostrar no ecrã quantos cm o robô andou (± 2 cm) }
  - noCollision

solution: |
  robotAPI.encoder_reset("L");
  robotAPI.drive("FOREWARD", 30);
  while (!(robotAPI.ultrasonic() < 10)) {}
  robotAPI.drive_stop();
  robotAPI.println(robotAPI.encoder("L", "ROTATION") * 20.42);

antiSolutions:
  - name: mostra a distância à parede
    why: O ultrassom mede o que falta, não o que andou.
    code: |
      robotAPI.drive("FOREWARD", 30);
      while (!(robotAPI.ultrasonic() < 10)) {}
      robotAPI.drive_stop();
      robotAPI.println(robotAPI.ultrasonic());
  - name: voltas em vez de cm
    why: Mostra as voltas da roda, sem as converter em centímetros.
    code: |
      robotAPI.encoder_reset("L");
      robotAPI.drive("FOREWARD", 30);
      while (!(robotAPI.ultrasonic() < 10)) {}
      robotAPI.drive_stop();
      robotAPI.println(robotAPI.encoder("L", "ROTATION"));
