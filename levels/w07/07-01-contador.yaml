# World 7: a counter. `when:` leaves out the stripes beyond n, and the wall follows
# the last stripe; the goal number is the parameter n.
id: "07-01"
world: 7
kind: core
title: Contador
objective: Anda até à parede e conta as riscas pretas por onde passas. No fim, mostra no ecrã quantas foram.
concepts: [variáveis, contador]
assumes: [sensor de cor, ultrassom, esperar até]
toolbox: expert
timeLimit: 40

variants:
  params:
    n: { min: 2, max: 6 }
    gap: { min: 15, max: 20 }
  seeds: [12, 7, 6, 1, 4, 18, 10, 30]   # every n from 2 to 6, small and big gaps

map:
  items:
    - patch: { x: 50, y: 31.25, w: 3, h: 60, colour: black }
    - patch: { x: 50 + gap, y: 31.25, w: 3, h: 60, colour: black }
    - { when: n >= 3, patch: { x: 50 + 2 * gap, y: 31.25, w: 3, h: 60, colour: black } }
    - { when: n >= 4, patch: { x: 50 + 3 * gap, y: 31.25, w: 3, h: 60, colour: black } }
    - { when: n >= 5, patch: { x: 50 + 4 * gap, y: 31.25, w: 3, h: 60, colour: black } }
    - { when: n >= 6, patch: { x: 50 + 5 * gap, y: 31.25, w: 3, h: 60, colour: black } }
    - wall: { x: 50 + n * gap + 15, y: 1, w: 4, h: 120.5 }

spawn: { x: 30, y: 61.25, heading: 0 }

goals:
  - displayShows: { number: n, label: Mostrar no ecrã quantas riscas pretas há }
  - noCollision

solution: |
  var riscas = 0;
  robotAPI.drive("FOREWARD", 30);
  while (!(robotAPI.ultrasonic() < 8)) {
    if (robotAPI.quadrgb("COLOUR", "L1") == "#000000") {
      riscas = riscas + 1;
      while (!(robotAPI.quadrgb("COLOUR", "L1") != "#000000")) {}
    }
  }
  robotAPI.drive_stop();
  robotAPI.println(riscas);

antiSolutions:
  - name: conta a mesma risca muitas vezes
    why: Sem esperar que a risca acabe, conta-a a cada volta do ciclo.
    code: |
      var riscas = 0;
      robotAPI.drive("FOREWARD", 30);
      while (!(robotAPI.ultrasonic() < 8)) {
        if (robotAPI.quadrgb("COLOUR", "L1") == "#000000") {
          riscas = riscas + 1;
        }
      }
      robotAPI.drive_stop();
      robotAPI.println(riscas);
  - name: número fixo
    why: Escreve sempre 4.
    code: |
      robotAPI.drive("FOREWARD", 30);
      while (!(robotAPI.ultrasonic() < 8)) {}
      robotAPI.drive_stop();
      robotAPI.println(4);
