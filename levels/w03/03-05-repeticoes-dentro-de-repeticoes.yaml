# World 3: a repeat inside a repeat. Four squares (left turns, so they sit above the
# line), each followed by a move to the next; ★★★ = 5 blocks.
id: "03-05"
world: 3
kind: core
title: Repetições dentro de repetições
objective: Desenha os quatro quadrados (25 cm de lado, a rodar para a esquerda), passando pelo canto de cima à direita de cada um, por ordem. Depois de cada quadrado anda 40 cm até ao início do seguinte, e no fim pára no círculo verde. Um quadrado é uma repetição... e quatro quadrados?
concepts: [repetições dentro de repetições]
assumes: [repetir]
toolbox: beginner
timeLimit: 90

map:
  items:
    - line: { points: [[15, 80], [40, 80], [40, 55], [15, 55], [15, 80]], width: 1, colour: black }
    - line: { points: [[55, 80], [80, 80], [80, 55], [55, 55], [55, 80]], width: 1, colour: black }
    - line: { points: [[95, 80], [120, 80], [120, 55], [95, 55], [95, 80]], width: 1, colour: black }
    - line: { points: [[135, 80], [160, 80], [160, 55], [135, 55], [135, 80]], width: 1, colour: black }
    - patch: { cx: 175, cy: 80, r: 8, colour: green }

spawn: { x: 15, y: 80, heading: 0 }

zones:
  - { id: q1, label: quadrado 1, cx: 40, cy: 55, r: 6 }
  - { id: q2, label: quadrado 2, cx: 80, cy: 55, r: 6 }
  - { id: q3, label: quadrado 3, cx: 120, cy: 55, r: 6 }
  - { id: q4, label: quadrado 4, cx: 160, cy: 55, r: 6 }
  - { id: fim, label: círculo verde, cx: 175, cy: 80, r: 8 }

goals:
  - sequence: { steps: [{ zone: q1 }, { zone: q2 }, { zone: q3 }, { zone: q4 }] }
  - robotStoppedIn: { zone: fim, probe: centre }
  - noCollision

solution: |
  for (var count2 = 0; count2 < 4; count2++) {
    for (var count = 0; count < 4; count++) {
      robotAPI.drive_for("FOREWARD", 30, 25);
      robotAPI.turn_for("LEFT", 30, 90);
    }
    robotAPI.drive_for("FOREWARD", 30, 40);
  }

antiSolutions:
  - name: sem avançar
    why: Sem andar até ao quadrado seguinte, desenha quatro vezes o mesmo quadrado.
    code: |
      for (var count = 0; count < 16; count++) {
        robotAPI.drive_for("FOREWARD", 30, 25);
        robotAPI.turn_for("LEFT", 30, 90);
      }
  - name: avançar dentro do quadrado
    why: O avanço ficou dentro da repetição de dentro, depois de cada lado.
    code: |
      for (var count2 = 0; count2 < 4; count2++) {
        for (var count = 0; count < 4; count++) {
          robotAPI.drive_for("FOREWARD", 30, 25);
          robotAPI.turn_for("LEFT", 30, 90);
          robotAPI.drive_for("FOREWARD", 30, 40);
        }
      }

challenge:
  maxBlocks: 5
  solution: |
    <export xmlns="http://de.fhg.iais.roberta.blockly"><program><block_set xmlns="http://de.fhg.iais.roberta.blockly" robottype="mbot2" xmlversion="3.1" description="" tags=""><instance x="40" y="40"><block type="robControls_start" intask="true" deletable="false"><mutation declare="false"></mutation><field name="DEBUG">TRUE</field></block><block type="controls_repeat_ext" intask="true"><value name="TIMES"><block type="math_number" intask="true"><field name="NUM">4</field></block></value><statement name="DO"><block type="controls_repeat_ext" intask="true"><value name="TIMES"><block type="math_number" intask="true"><field name="NUM">4</field></block></value><statement name="DO"><block type="robActions_motorDiff_on_for" intask="true"><field name="DIRECTION">FOREWARD</field><field name="ACTORPORT">_D</field><hide name="ACTORPORT" value="_D"></hide><value name="POWER"><block type="math_number" intask="true"><field name="NUM">30</field></block></value><value name="DISTANCE"><block type="math_number" intask="true"><field name="NUM">25</field></block></value></block><block type="robActions_motorDiff_turn_for" intask="true"><field name="DIRECTION">LEFT</field><field name="ACTORPORT">_D</field><hide name="ACTORPORT" value="_D"></hide><value name="POWER"><block type="math_number" intask="true"><field name="NUM">30</field></block></value><value name="DEGREE"><block type="math_number" intask="true"><field name="NUM">90</field></block></value></block></statement></block><block type="robActions_motorDiff_on_for" intask="true"><field name="DIRECTION">FOREWARD</field><field name="ACTORPORT">_D</field><hide name="ACTORPORT" value="_D"></hide><value name="POWER"><block type="math_number" intask="true"><field name="NUM">30</field></block></value><value name="DISTANCE"><block type="math_number" intask="true"><field name="NUM">40</field></block></value></block></statement></block></instance></block_set></program></export>
