# World 3 test (Prova): climb a staircase corridor. 3 steps of 40 cm across and
# 30 cm up; ★★★ = repeat 3 { 4 moves } = 5 blocks. Deep steps in a narrow
# corridor: no straight diagonal fits (checked by brute force when it was made).
id: "03-08"
world: 3
kind: challenge
title: "Prova: Escadaria"
objective: Sobe a escadaria sem tocar nas paredes e pára no círculo verde lá em cima. Cada degrau tem 40 cm para a frente e 30 cm para cima. Se conseguires à primeira, podes saltar o Mundo 3!
concepts: [repetir, padrões]
assumes: [repetir]
toolbox: beginner
timeLimit: 60

map:
  items:
    - wall: { x: 5.5, y: 91.5, w: 43, h: 3 }
    - wall: { x: 45.5, y: 61.5, w: 3, h: 33 }
    - wall: { x: 45.5, y: 61.5, w: 43, h: 3 }
    - wall: { x: 85.5, y: 31.5, w: 3, h: 33 }
    - wall: { x: 85.5, y: 31.5, w: 43, h: 3 }
    - wall: { x: 125.5, y: 1.5, w: 3, h: 33 }
    - wall: { x: 5.5, y: 91.5, w: 3, h: 29 }
    - wall: { x: 31.5, y: 117.5, w: 43, h: 3 }
    - wall: { x: 71.5, y: 87.5, w: 3, h: 33 }
    - wall: { x: 71.5, y: 87.5, w: 43, h: 3 }
    - wall: { x: 111.5, y: 57.5, w: 3, h: 33 }
    - wall: { x: 111.5, y: 57.5, w: 43, h: 3 }
    - wall: { x: 151.5, y: 27.5, w: 3, h: 33 }
    - patch: { cx: 140, cy: 16, r: 8, colour: green }

spawn: { x: 20, y: 106, heading: 0 }

zones:
  - { id: topo, label: círculo verde, cx: 140, cy: 16, r: 8 }

goals:
  - robotStoppedIn: { zone: topo, probe: centre }
  - noCollision

solution: |
  for (var count = 0; count < 3; count++) {
    robotAPI.drive_for("FOREWARD", 30, 40);
    robotAPI.turn_for("LEFT", 30, 90);
    robotAPI.drive_for("FOREWARD", 30, 30);
    robotAPI.turn_for("RIGHT", 30, 90);
  }

antiSolutions:
  - name: na diagonal
    why: A direito até lá acima é mais curto, mas o corredor é estreito demais - bate nos degraus.
    code: |
      robotAPI.turn_for("LEFT", 30, 36.9);
      robotAPI.drive_for("FOREWARD", 30, 150);
  - name: um degrau a menos
    why: Repete 2 vezes e fica um degrau abaixo do círculo.
    code: |
      for (var count = 0; count < 2; count++) {
        robotAPI.drive_for("FOREWARD", 30, 40);
        robotAPI.turn_for("LEFT", 30, 90);
        robotAPI.drive_for("FOREWARD", 30, 30);
        robotAPI.turn_for("RIGHT", 30, 90);
      }

challenge:
  maxBlocks: 5
  solution: |
    <export xmlns="http://de.fhg.iais.roberta.blockly"><program><block_set xmlns="http://de.fhg.iais.roberta.blockly" robottype="mbot2" xmlversion="3.1" description="" tags=""><instance x="40" y="40"><block type="robControls_start" intask="true" deletable="false"><mutation declare="false"></mutation><field name="DEBUG">TRUE</field></block><block type="controls_repeat_ext" intask="true"><value name="TIMES"><block type="math_number" intask="true"><field name="NUM">3</field></block></value><statement name="DO"><block type="robActions_motorDiff_on_for" intask="true"><field name="DIRECTION">FOREWARD</field><field name="ACTORPORT">_D</field><hide name="ACTORPORT" value="_D"></hide><value name="POWER"><block type="math_number" intask="true"><field name="NUM">30</field></block></value><value name="DISTANCE"><block type="math_number" intask="true"><field name="NUM">40</field></block></value></block><block type="robActions_motorDiff_turn_for" intask="true"><field name="DIRECTION">LEFT</field><field name="ACTORPORT">_D</field><hide name="ACTORPORT" value="_D"></hide><value name="POWER"><block type="math_number" intask="true"><field name="NUM">30</field></block></value><value name="DEGREE"><block type="math_number" intask="true"><field name="NUM">90</field></block></value></block><block type="robActions_motorDiff_on_for" intask="true"><field name="DIRECTION">FOREWARD</field><field name="ACTORPORT">_D</field><hide name="ACTORPORT" value="_D"></hide><value name="POWER"><block type="math_number" intask="true"><field name="NUM">30</field></block></value><value name="DISTANCE"><block type="math_number" intask="true"><field name="NUM">30</field></block></value></block><block type="robActions_motorDiff_turn_for" intask="true"><field name="DIRECTION">RIGHT</field><field name="ACTORPORT">_D</field><hide name="ACTORPORT" value="_D"></hide><value name="POWER"><block type="math_number" intask="true"><field name="NUM">30</field></block></value><value name="DEGREE"><block type="math_number" 