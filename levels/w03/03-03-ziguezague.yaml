# World 3: repeat a pair of moves. Posts from the top and bottom walls overlap, so
# only a zigzag gets through; ★★★ = turn + repeat 3 { 4 moves } = 6 blocks.
id: "03-03"
world: 3
kind: core
title: Ziguezague
objective: Passa entre os postes em ziguezague e pára no círculo verde. Começa por rodar 45° para a direita; depois cada troço mede 36 cm e, entre troços, o robô roda 90° - uma vez para a esquerda, outra para a direita. Que par de movimentos se repete?
concepts: [repetir, padrões]
assumes: [repetir]
toolbox: beginner
timeLimit: 50

map:
  items:
    - box: { x: 43, y: 1, w: 5, h: 49 }
    - box: { x: 68.4, y: 55, w: 5, h: 66.5 }
    - box: { x: 93.9, y: 1, w: 5, h: 49 }
    - box: { x: 119.3, y: 55, w: 5, h: 66.5 }
    - box: { x: 144.8, y: 1, w: 5, h: 49 }
    - patch: { cx: 172.7, cy: 40, r: 8, colour: green }

spawn: { x: 20, y: 40, heading: 0 }

zones:
  - { id: fim, label: círculo verde, cx: 172.7, cy: 40, r: 8 }

goals:
  - robotStoppedIn: { zone: fim, probe: centre }
  - noCollision

solution: |
  robotAPI.turn_for("RIGHT", 30, 45);
  for (var count = 0; count < 3; count++) {
    robotAPI.drive_for("FOREWARD", 30, 36);
    robotAPI.turn_for("LEFT", 30, 90);
    robotAPI.drive_for("FOREWARD", 30, 36);
    robotAPI.turn_for("RIGHT", 30, 90);
  }

antiSolutions:
  - name: a direito
    why: Em linha reta bate no primeiro poste.
    code: |
      robotAPI.drive_for("FOREWARD", 30, 152.7);
  - name: só um par
    why: Repetir só um movimento e uma rotação faz o robô andar em quadrado, não em ziguezague.
    code: |
      robotAPI.turn_for("RIGHT", 30, 45);
      for (var count = 0; count < 6; count++) {
        robotAPI.drive_for("FOREWARD", 30, 36);
        robotAPI.turn_for("LEFT", 30, 90);
      }

challenge:
  maxBlocks: 6
  solution: |
