# World 3 bonus: LEDs blink 10 times on the way. The 5-block ★★★ answer blinks
# between short drives; "drive on + timed blinks + stop" also passes (7 blocks).
id: "03-06"
world: 3
kind: bonus
title: Pisca-pisca
objective: Leva o robô até à meta, a 160 cm, e pára lá dentro. Pelo caminho os LEDs piscam a verde 10 vezes (acesos, apagados, acesos, apagados...).
concepts: [repetir, LEDs]
assumes: [repetir, LEDs]
toolbox: beginner
timeLimit: 40

map:
  items:
    - patch: { x: 170, y: 46, w: 20, h: 30, colour: green }

spawn: { x: 20, y: 61, heading: 0 }

zones:
  - { id: meta, label: meta verde, x: 170, y: 46, w: 20, h: 30 }

goals:
  - sequence: { steps: [{ leds: green }, { leds: off }], times: 10 }
  - robotStoppedIn: { zone: meta, probe: centre }
  - noCollision

solution: |
  for (var count = 0; count < 10; count++) {
    robotAPI.led_on("ALL", "#33cc00");
    robotAPI.drive_for("FOREWARD", 30, 8);
    robotAPI.led_off("ALL");
    robotAPI.drive_for("FOREWARD", 30, 8);
  }

antiSolutions:
  - name: sempre aceso
    why: Acende os LEDs uma vez e anda; não pisca.
    code: |
      robotAPI.led_on("ALL", "#33cc00");
      robotAPI.drive_for("FOREWARD", 30, 160);
  - name: sem esperar
    why: Acende e apaga logo a seguir, sem nada no meio - não se vê piscar.
    code: |
      for (var count = 0; count < 10; count++) {
        robotAPI.led_on("ALL", "#33cc00");
        robotAPI.led_off("ALL");
      }
      robotAPI.drive_for("FOREWARD", 30, 160);

challenge:
  maxBlocks: 5
  solution: |
