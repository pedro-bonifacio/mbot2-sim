# World 5 bonus: find the bug. The level opens with a broken program (starter): a
# "repeat forever" whose stop never lasts, because the loop drives on again at once.
id: "05-14"
world: 5
kind: bonus
title: O robô não pára!
objective: "Este programa devia parar o robô no quadrado verde, mas o robô passa por cima e bate na parede. Descobre porquê e corrige-o: pára com o anel amarelo do robô dentro do quadrado verde."
concepts: [encontrar erros, repetir sempre]
assumes: [sensor de cor, se/senão, esperar até]
toolbox: beginner
timeLimit: 30

variants:
  params:
    patchX: { min: 60, max: 150, step: 10 }
  seeds: [1, 2, 3, 4, 5, 6]

map:
  items:
    - patch: { x: patchX, y: 48.75, w: 25, h: 25, colour: green }

spawn: { x: 25, y: 61.25, heading: 0 }

zones:
  - { id: alvo, label: quadrado verde, x: patchX, y: 48.75, w: 25, h: 25 }

goals:
  - robotStoppedIn: { zone: alvo, probe: centre }
  - noCollision

# The broken program the level opens with (saved from the sim).
starter: |
  <xml xmlns="https://developers.google.com/blockly/xml"><block type="robControls_start" id="*:gq,yh_l;h|wR+0I7HO" deletable="false" x="93" y="63"><mutation declare="false"></mutation><field name="DEBUG"></field><next><block type="robControls_loopForever" id="#QyG:,bc,Fa9egGGAw3T"><statement name="DO"><block type="robControls_ifElse" id=";Vmj5U/Z6uAJC@U(WsyA"><mutation else="1"></mutation><value name="IF0"><block type="logic_compare" id="r_v0)7h(n35~d$zxR]ws"><field name="OP">NEQ</field><value name="A"><block type="robSensors_quadrgb_getSample" id="NqQQv^NMql/R*wTki^Rd"><mutation mode="COLOUR"></mutation><field name="MODE">COLOUR</field><field name="SENSORPORT">Q</field><field name="SLOT">L1</field></block></value><value name="B"><block type="robColour_picker" id="_Dsx*swu-j~eRXUfcV1D"><field name="COLOUR">#33cc00</field></block></value></block></value><statement name="DO0"><block type="robActions_motorDiff_on" id="Q/L|0kS00_=)}}CLW{XD"><field name="ACTORPORT">_D</field><field name="DIRECTION">FOREWARD</field><value name="POWER"><block type="math_number" id="*xRy^VrO@+V`KdZVr%th"><field name="NUM">30</field></block></value></block></statement><statement name="ELSE"><block type="robActions_motorDiff_on_for" id="~RL/TP564C^B*XGp0()B"><field name="ACTORPORT">_D</field><field name="DIRECTION">FOREWARD</field><value name="POWER"><block type="math_number" id="#*xY]vo,YMjkjt_1.}7T"><field name="NUM">30</field></block></value><value name="DISTANCE"><block type="math_number" id="|MT8AWZNAlZunDiU%#I["><field name="NUM">2</field></block></value><next><block type="robActions_motorDiff_stop" id="~U.yv|h+Z(VHOY%OL$6u"><field name="ACTORPORT">_D</field></block></next></block></statement></block></statement></block></next></block></xml>

solution: |
  robotAPI.drive("FOREWARD", 30);
  while (!(robotAPI.quadrgb("COLOUR", "L1") == "#33cc00")) {}
  robotAPI.drive_for("FOREWARD", 30, 10);
  robotAPI.drive_stop();

antiSolutions:
  - name: só 2 cm
    why: O sensor de cor está 6 cm à frente do centro; 2 cm depois de ver verde, o anel amarelo ainda não chegou ao quadrado.
    code: |
      robotAPI.drive("FOREWARD", 30);
      while (!(robotAPI.quadrgb("COLOUR", "L1") == "#33cc00")) {}
      robotAPI.drive_for("FOREWARD", 30, 2);
      robotAPI.drive_stop();
  - name: distância fixa
    why: O quadrado verde não está sempre no mesmo sítio.
    code: |
      robotAPI.drive_for("FOREWARD", 30, 60);
