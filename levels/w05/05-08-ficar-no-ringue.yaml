# World 5: P3 "Ficar no ringue". stayIn: the robot's centre must never leave the ring
# (its outer edge) and the run only passes at the time limit; a robot that stops
# stalls after 5 s, one that never moves fails at the limit. On one course board
# (decision 0018): no walls, as on the table.
id: "05-08"
world: 5
kind: core
title: Ficar no ringue
objective: Anda pelo ringue durante 30 segundos sem sair dele. Quando vires a linha preta, volta para dentro. Não vale ficar parado!
concepts: [sensor de cor, repetir para sempre]
assumes: [esperar até, rodar um ângulo]
toolbox: beginner
timeLimit: 30

variants:
  params:
    w: { min: 70, max: 90, step: 5 }
    h: { min: 50, max: 60, step: 5 }
  seeds: [5, 7, 9, 4, 18, 30]   # small and large rings, wide and tall

map:
  board: 1
  items:
    - line: { points: [[50 - w / 2, 35 - h / 2], [50 + w / 2, 35 - h / 2], [50 + w / 2, 35 + h / 2], [50 - w / 2, 35 + h / 2], [50 - w / 2, 35 - h / 2]], width: 2, colour: black }

spawn: { x: 50, y: 35, heading: 20 }

zones:
  - { id: ringue, x: 50 - w / 2 - 1, y: 35 - h / 2 - 1, w: w + 2, h: h + 2 }

goals:
  - stayIn: { zone: ringue }
  - noCollision

solution: |
  while (true) {
    robotAPI.drive("FOREWARD", 40);
    while (!(robotAPI.quadrgb("COLOUR", "L1") == "#000000" || robotAPI.quadrgb("COLOUR", "R1") == "#000000")) {}
    robotAPI.drive_for("BACKWARD", 40, 5);
    robotAPI.turn_for("RIGHT", 40, 135);
  }

antiSolutions:
  - name: sempre em frente
    why: Atravessa a linha e sai do ringue.
    code: |
      robotAPI.drive("FOREWARD", 40);
      while (true) {}
  - name: pára na linha
    why: Pára na primeira linha em vez de voltar para dentro.
    code: |
      robotAPI.drive("FOREWARD", 40);
      while (!(robotAPI.quadrgb("COLOUR", "L1") == "#000000")) {}
      robotAPI.drive_stop();
      while (true) {}
  - name: fica parado
    why: Nunca sai do ringue, mas também nunca anda.
    code: |
      while (true) {}
