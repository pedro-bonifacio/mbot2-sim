# World 1: going round the end of a wall. The curve block does it in one move;
# drive + turn also works.
id: "01-06"
world: 1
kind: core
title: Curva
objective: O quadrado verde está do outro lado da parede. Dá a volta à ponta da parede e pára com o centro do robô dentro dele. Experimenta o bloco da curva!
concepts: [curva]
assumes: [andar uma distância, rodar um ângulo]
toolbox: beginner
timeLimit: 40

map:
  items:
    - wall:  { x: 1, y: 55, w: 74, h: 12 }
    - patch: { x: 32.5, y: 84.5, w: 15, h: 15, colour: green }

spawn: { x: 40, y: 30, heading: 0 }

zones:
  - { id: alvo, label: quadrado verde, x: 32.5, y: 84.5, w: 15, h: 15 }

goals:
  - robotStoppedIn: { zone: alvo, probe: centre }
  - noCollision

solution: |
  robotAPI.drive_for("FOREWARD", 30, 50);
  robotAPI.curve_for("FOREWARD", 40, 27.5, 97.4);
  robotAPI.drive_for("FOREWARD", 30, 50);

antiSolutions:
  - name: a direito
    why: Roda e anda a direito para o quadrado, mas a parede está no caminho.
    code: |
      robotAPI.turn_for("RIGHT", 30, 90);
      robotAPI.drive_for("FOREWARD", 30, 62);
  - name: curva curta
    why: A curva não chega a dar a volta completa.
    code: |
      robotAPI.drive_for("FOREWARD", 30, 50);
      robotAPI.curve_for("FOREWARD", 40, 27.5, 50);
      robotAPI.drive_for("FOREWARD", 30, 50);
