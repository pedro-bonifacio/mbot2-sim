<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulador mBot 2</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <header id="topbar">
    <h1>Simulador mBot 2</h1>
    <div id="controls">
      <div class="group">
        <button id="btn-run" class="primary">▶ Executar</button>
        <button id="btn-stop">■ Parar</button>
        <button id="btn-reset">↻ Reiniciar</button>
        <button id="btn-speed" title="Velocidade da simulação (o resultado é sempre o mesmo)">×1</button>
        <button id="btn-center" title="Centrar a vista no mapa">🔍 Centrar</button>
      </div>
      <div class="group">
        <button id="btn-levels">★ Níveis</button>
        <span id="current-map"></span>
      </div>
      <div class="group">
        <div class="menu" id="file-menu">
          <button id="btn-file" aria-haspopup="true" aria-expanded="false">Ficheiro ▾</button>
          <div class="menu-items" role="menu" hidden>
            <button id="btn-new" role="menuitem">Novo programa</button>
            <button id="btn-load" role="menuitem">Abrir programa…</button>
            <button id="btn-save" role="menuitem">Guardar programa…</button>
            <hr />
            <button id="btn-export-or" role="menuitem" title="Guarda um ficheiro para importar no Open Roberta Lab (mBot 2)">Exportar para Open Roberta…</button>
            <hr />
            <button id="btn-progress-export" role="menuitem" title="Guarda as estrelas e os programas de todos os níveis num ficheiro, para levar para outro computador">Guardar progresso…</button>
            <button id="btn-progress-import" role="menuitem" title="Abre um ficheiro de progresso guardado noutro computador">Abrir progresso…</button>
          </div>
        </div>
        <select id="toolbox-mode" title="Blocos disponíveis">
          <option value="level" hidden title="Só os blocos que já aprendeste até este mundo">Deste nível</option>
          <option value="beginner">Principiante</option>
          <option value="expert">Avançado</option>
        </select>
      </div>
      <input type="file" id="file-input-load" accept=".xml" hidden />
      <input type="file" id="file-input-progress" accept=".json,application/json" hidden />
    </div>
  </header>
  <dialog id="level-selector"></dialog>
  <main>
    <div id="blockly-area"></div>
    <div id="splitter" role="separator" aria-orientation="vertical"></div>
    <div id="sim-area">
      <section id="level-panel" hidden></section>
      <div id="canvas-wrapper">
        <canvas id="sim-canvas" width="1600" height="980"></canvas>
      </div>
      <div class="screen-console-row">
        <div id="button-row-wrapper">
          <span class="button-row-label">Controlador</span>
          <div id="button-row"></div>
        </div>
        <canvas id="display-canvas" width="256" height="256"></canvas>
        <div id="console-panel"></div>
      </div>
    </div>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
